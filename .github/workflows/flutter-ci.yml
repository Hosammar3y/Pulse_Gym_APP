name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test test

      - name: Install Linux integration host dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev xvfb

      - name: Generate temporary Linux integration host
        run: flutter create --platforms=linux --project-name pulse_coach_mobile .

      - name: Integration tests
        run: xvfb-run -a flutter test integration_test -d linux
